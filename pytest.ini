[pytest]
# Root-level config: the repository root is the rootdir because tests span
# `backend/`, `scripts/` and `config/`.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
pythonpath = backend scripts
markers =
    integration: requires a live PostgreSQL/TimescaleDB instance
    network: performs real outbound network calls
filterwarnings =
    ignore::DeprecationWarning
