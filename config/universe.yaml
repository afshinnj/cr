# Tracked asset universe. Profile selected via UNIVERSE_PROFILE in .env.
# Current project scope: `small` (confirmed in ADR O1).
#
# Iranian symbols are keyed by their TSETMC instrument code (ins_code), which is
# stable across symbol renames; the Persian symbol is only a display label and
# is verified during seeding.

