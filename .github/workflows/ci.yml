name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: Lint, types, architecture, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        working-directory: backend
        run: ruff check app ../scripts ../tests

      - name: Ruff (format)
        working-directory: backend
        run: ruff format --check app ../scripts ../tests

      - name: mypy --strict
        working-directory: backend
        run: mypy app

      - name: Architecture invariants (I1..I12)
        run: python scripts/check_architecture.py

      - name: Unit tests
        run: pytest -m "not integration and not network" -q --cov=backend/app --cov-report=term-missing

  integration:
    name: Integration tests (TimescaleDB)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_DB: amip_test
          POSTGRES_USER: amip
          POSTGRES_PASSWORD: amip
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U amip -d amip_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://amip:amip@localhost:5432/amip_test
      DATABASE_URL: postgresql+asyncpg://amip:amip@localhost:5432/amip_test
      POSTGRES_PASSWORD: amip
      LOCAL_API_TOKEN: ci-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply migrations (creates hypertables)
        working-directory: backend
        run: alembic upgrade head

      - name: Verify hypertables exist
        working-directory: backend
        run: |
          python - <<'PY'
          import asyncio, os
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine
          from app.database.timescale import HYPERTABLES

          async def main() -> None:
              engine = create_async_engine(os.environ["DATABASE_URL"])
              async with engine.connect() as conn:
                  rows = await conn.execute(
                      text("SELECT hypertable_name FROM timescaledb_information.hypertables")
                  )
                  found = {r[0] for r in rows}
              expected = {s.table for s in HYPERTABLES}
              missing = expected - found
              assert not missing, f"missing hypertables: {sorted(missing)}"
              print(f"OK: {len(found)} hypertables")
              await engine.dispose()

          asyncio.run(main())
          PY

      - name: Seed reference data (twice — must be idempotent)
        run: |
          python scripts/seed_reference_data.py
          python scripts/seed_reference_data.py

      - name: Integration tests
        run: pytest -m "integration" -q
